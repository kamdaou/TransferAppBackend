spring.application.name=transferapp

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transferapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-key-min-32-characters-long!!}
app.jwt.expiration-ms=86400000

# Server
server.port=8080

# Super Admin
app.super-admin.phone=${SUPER_ADMIN_PHONE:+23500000000}
app.super-admin.pin=${SUPER_ADMIN_PIN:000000}

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
